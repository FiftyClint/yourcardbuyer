# The Worker that serves yourcardbuyer.com and receives the seller form.
#
# NOT LIVE. There is no route below on purpose: until Clint says go, a deploy
# can only land on the workers.dev preview address. At launch, uncomment the
# routes block (docs/LAUNCH.md). The domain's nameservers must point at
# Cloudflare first, and that is Clint's step.
name = "yourcardbuyer"
main = "worker/index.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[vars]
SITE_DOMAIN = "yourcardbuyer.com"
# GHL sub-account "Your Card Buyer" (read through the HighLevel connection 2026-10-25).
GHL_LOCATION_ID = "x2TNpESH8cl6WVaA2Gru"
# Set after the photo field exists in GHL (docs/GHL-SETUP.md step 2).
GHL_PHOTO_FIELD_ID = ""
# Optional. Set after the "Card Offers" pipeline exists (docs/GHL-SETUP.md step 3).
GHL_PIPELINE_ID = ""
GHL_STAGE_ID = ""
# GHL_TOKEN is a secret: `npx wrangler secret put GHL_TOKEN`. Never put it here.

# [[routes]]
# pattern = "yourcardbuyer.com"
# custom_domain = true
# [[routes]]
# pattern = "www.yourcardbuyer.com"
# custom_domain = true
